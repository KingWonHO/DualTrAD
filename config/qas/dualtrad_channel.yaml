extends: dualtrad.yaml

# DualTrAD plus a channel-axis encoder. Its tokens are concatenated to the
# temporal memory read by the horizon queries; the autoencoder is untouched.
experiment:
  name: QAS_DualTrAD_Channel

model:
  channel_encoder_params:
    enabled: true
    n_heads: 4
    num_layers: 2
    feedforward_dim: 256
    dropout: 0.1
