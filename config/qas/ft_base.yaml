extends: _base.yaml

# Minimal forecasting reference: last-state decoder, no autoencoder. The
# decoder carries no parameters, so horizons differ only through the heads.
experiment:
  name: QAS_FTBase

model:
  name: DualTrAD
  context_length: 20
  horizon_count: 3
  input_dim: 4
  output_dim: 4
  encoder_params:
    encoder_type: CausalTransformerEncoder
    d_model: 32
    n_heads: 4
    num_layers: 2
    feedforward_dim: 128
    dropout: 0.1
    positional_encoding: sinusoidal
    causal: true
  decoder_params:
    decoder_type: LastStateDecoder
  head_params:
    hidden_dim: 64
    dropout: 0.1
  autoencoder_params:
    enabled: false
