# Shared contract for every QAS run. A model config states only what it changes.
experiment:
  seed: 42
  device: auto
  deterministic: true

data:
  aggregate_dir: ../HybridTrAD/data/qas_only
  # Column order in the aggregate NPZ is [V, I, T, SOC]; the loader stacks the
  # names below in exactly this order.
  features: [V, I, T, SOC]
  train_split: train
  validation_split: validation
  calibration_split: calibration_normal
  test_normal_split: test_normal
  test_abnormal_split: test_abnormal
  context_length: 20
  horizon_steps: [1, 3, 5]        # 30 / 90 / 150 s at a 30 s sampling period
  stride: 5
  offset_mode: series_first
  max_train_windows_per_vehicle: 1024
  max_eval_windows_per_vehicle: 4096
  batch_size: 512

training:
  epochs: 30
  patience: 5
  learning_rate: 0.0003
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  # FP32. The four channels differ by four orders of magnitude in scale
  # (current std 341 vs voltage std 0.057) and fp16 overflows on this contract.
  amp: false

loss:
  prediction: huber
  huber_delta: 1.0
  horizon_weights: [0.5, 0.3, 0.2]
  reconstruction: l1
  derivative_weight: 0.0
  lambda_reconstruction: 0.0
  lambda_trajectory: 0.0
  lambda_consistency: 0.0

corruption:
  mask_probability: 0.0
  gaussian_std: 0.0

scoring:
  prediction_error: squared
  normalizer_quantile: 0.99
  vehicle_quantile: 0.99
  fusion: forecast_only
  target_fpr: 0.10
